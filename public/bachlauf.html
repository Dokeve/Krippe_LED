<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bachlauf - Pumpensteuerung</title>
  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/js/statusbar.js"></script>
  <script defer src="/js/bachlauf.js"></script>
  <script defer src="/js/footer.js"></script>
</head>
<body>
  <main id="main" role="main">
    <nav class="top-nav" aria-label="Hauptnavigation">
      <a href="index.html">Start</a>
      <a href="audio.html">Audio</a>
      <a href="led-groups.html">LED</a>
      <a href="calendar.html">Kalender</a>
      <a href="star.html">Sternsteuerung</a>
      <a href="bachlauf.html">Bachlauf</a>
      <a href="export.html">Export</a>
    </nav>

    <!-- Unified Status Bar: kurz und informativ -->
    <div id="status-bar" role="status" aria-live="polite">
      <div class="status-item" id="status-mode">Modus: <strong id="status-mode-value">-</strong></div>
      <div class="status-item" id="status-led">LEDs: <span id="status-led-value">-</span></div>
      <div class="status-item" id="status-audio">Audio: <span id="status-audio-value">-</span></div>
      <div class="status-item" id="status-calendar">Kalender: <span id="status-calendar-value">-</span></div>
  <div class="status-item" id="status-scenario"> <span id="status-scenario-value"></span></div>
  <div class="status-item" id="status-bachlauf">Bachlauf: <span id="status-bachlauf-value">-</span></div>
    </div>

    <section>
      <h1>Bachlauf - Pumpensteuerung</h1>
      <p>Direktsteuerung der Pumpe und Test‑Funktionen.</p>

      <div class="row">
        <label>Testdauer (s) <input id="test-duration" type="number" min="1" value="5" /></label>
        <button id="test-pulse">Test (5s)</button>
      </div>

      <div class="row">
        <button id="start-pump">Starten</button>
        <button id="stop-pump">Stoppen</button>
      </div>

      <h2>Status</h2>
      <pre id="bachlauf-status">lade...</pre>
    </section>
  </main>
</body>
</html>
