# Drop-in template for /etc/systemd/system/pigpiod.service.d/permissions.conf
# Purpose: ensure pigpiod-created device/FIFOs are owned by root:gpio and have group read/write
# Apply on the Pi with the commands shown in the README section below.

[Service]
ExecStartPost=/bin/sh -c 'for i in 1 2 3 4 5; do [ -e /dev/pigerr ] && break || sleep 0.2; done; if [ -e /dev/pigerr ]; then /bin/chown root:gpio /dev/pigerr; /bin/chmod 0660 /dev/pigerr; fi'
ExecStartPost=/bin/sh -c 'for i in 1 2 3 4 5; do [ -e /dev/pigout ] && break || sleep 0.2; done; if [ -e /dev/pigout ]; then /bin/chown root:gpio /dev/pigout; /bin/chmod 0660 /dev/pigout; fi'
ExecStartPost=/bin/sh -c 'for i in 1 2 3 4 5; do [ -e /dev/pigpio ] && break || sleep 0.2; done; if [ -e /dev/pigpio ]; then /bin/chown root:gpio /dev/pigpio; /bin/chmod 0660 /dev/pigpio; fi'

# also adjust /dev/gpiomem if present (used by some native LED/rpi libraries)
ExecStartPost=/bin/sh -c 'for i in 1 2 3 4 5; do [ -e /dev/gpiomem ] && break || sleep 0.2; done; if [ -e /dev/gpiomem ]; then /bin/chown root:gpio /dev/gpiomem; /bin/chmod 0660 /dev/gpiomem; fi'

# Note: ExecStartPost is not run in a shell by default, so we wrap commands with
# /bin/sh -c to allow redirections, ||, and small logic. We wait a short time for
# device nodes to be created by pigpiod and then adjust ownership/mode. If you
# need persistent early-boot device permissions, consider a `/etc/tmpfiles.d`
# entry (e.g. `F /dev/gpiomem 0660 root gpio - -`) instead of or in addition to
# these ExecStartPost hooks.
